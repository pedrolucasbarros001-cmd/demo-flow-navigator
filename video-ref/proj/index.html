<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" />
<script src="gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  :root {
    --preto: #080303; --preto2: #1C0806; --creme: #F1EDE0; --tinta: #0B0A0A; --verm: #DF1904;
    --chip: #160E0B; --linha: #3A2C26;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--preto); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--preto);
    font-family: 'Anton', sans-serif; }
  .abs { position: absolute; left: 0; top: 0; }
  #fundo { width: 1080px; height: 1920px; }
  #fundo.k { background: radial-gradient(ellipse 80% 60% at 50% 52%, var(--preto2) 0%, var(--preto) 70%); }
  #fundo.c { background: var(--creme); }
  #fundo.r { background: var(--verm); }
  #palco { width: 1080px; height: 1920px; }
  #fx { width: 1080px; height: 1920px; }
  #fx text { font-family: 'Anton', sans-serif; }
  .tela { display: none; width: 1080px; }
  .l { white-space: nowrap; line-height: 0.95; }
  .l > span { display: inline-block; }
  .w { display: inline-block; text-transform: uppercase; will-change: transform, filter, opacity; }
  .w.larga { font-family: 'Archivo Black', sans-serif; letter-spacing: -0.03em; }
  .w.contorno { color: transparent !important; -webkit-text-stroke: 3px currentColor; }
  .tela.k .w, .tela.r .w { color: var(--creme); }
  .tela.c .w { color: var(--tinta); }
  .tela.k .w.dest, .tela.c .w.dest { color: var(--verm); }
  .tela.r .w.dest { color: var(--tinta); }
  .tela.k .w.soco { color: var(--creme); text-shadow: 0 0 34px rgba(223,25,4,.85), 0 0 90px rgba(223,25,4,.5); }
  .tela.c .w.soco { color: var(--verm); }
  .tela.r .w.soco { color: var(--creme); text-shadow: 0 10px 40px rgba(60,0,0,.45); }
  .carimbo .bloco { border: 12px solid var(--verm); padding: 26px 40px 30px; }
  .carimbo .w { color: var(--verm) !important; }
  .risco { width: 1080px; height: 6px; background: var(--verm); transform-origin: 0 50%;
    box-shadow: 0 0 18px 4px rgba(223,25,4,.8), 0 0 60px 10px rgba(223,25,4,.35); }
  .risco::after { content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 2px; background: #FFD9CF; }
  #marca { width: 1080px; text-align: center; display: none; }
  #marca .w { font-family: 'Archivo Black', sans-serif; letter-spacing: -0.035em; color: var(--creme); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="239.85" data-width="1080" data-height="1920">
  <div id="fundo" class="abs k"></div>
  <svg id="fx" class="abs" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="palco" class="abs"></div>
  <div id="risco" class="abs risco" style="opacity:0"></div>
</div>
<script src="roteiro.js"></script>
<script src="tempos.js"></script>
<script src="motor.js"></script>
</body>
</html>
