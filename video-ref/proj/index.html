<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Open+Sans:wdth,wght@75,300;75,400&display=swap" />
<script src="gsap.min.js"></script>
<script src="rough.js"></script>
<script src="studio.js"></script>
<style>
  :root {
    --preto: #080303; --preto2: #2A0705; --creme: #F3F0E8; --tinta: #121010; --verm: #DF1904;
    --azul: #2AA7E0; --laranja: #EFA24A; --verde: #1F8A3B; --cinza: #5B5753;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--preto); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--preto); font-family: 'Anton', sans-serif; }
  .abs { position: absolute; left: 0; top: 0; }
  .cheio { width: 1080px; height: 1920px; }
  #fundo.k { background: var(--preto); }
  #fundo.c { background: var(--creme); }
  #fundo.r { background: var(--verm); }
  #luz { width: 1600px; height: 1600px; margin: -800px 0 0 -800px; border-radius: 50%;
    background: radial-gradient(circle, rgba(170,18,6,.55) 0%, rgba(110,10,4,.25) 35%, rgba(8,3,3,0) 70%); }
  #faixas { overflow: hidden; }
  #faixas i { position: absolute; width: 2600px; height: 380px; left: -760px; background: rgba(60,0,0,.22); }
  #vinheta.c { background: radial-gradient(ellipse 85% 70% at 50% 50%, rgba(0,0,0,0) 60%, rgba(70,55,40,.16) 100%); }
  #lousa text.rotulo { font-family: 'Open Sans', sans-serif; font-stretch: 75%; font-weight: 300; fill: var(--cinza); }
  #lousa text.forte { font-family: 'Anton', sans-serif; }
  #palco { perspective: 1500px; perspective-origin: 540px 960px; }
  .tela { display: none; width: 1080px; height: 1920px; transform-style: preserve-3d; }
  .bloco { position: absolute; }
  .l { white-space: nowrap; line-height: 0.9; }
  .w br + .b2 { display: inline-block; }
  .l > span { display: inline-block; }
  .w { display: inline-block; text-transform: uppercase; vertical-align: baseline; will-change: transform, filter, opacity; }
  .w.larga { font-family: 'Archivo Black', sans-serif; letter-spacing: -0.035em; }
  .w.mini { font-size: 0.5em; }
  .w.contorno { color: transparent !important; -webkit-text-stroke: 3px var(--creme); }
  .w .b2 { color: var(--verm); }
  .tela.k .w, .tela.r .w { color: var(--creme); }
  .tela.c .w { color: var(--tinta); }
  .tela.k .w.dest, .tela.c .w.dest { color: var(--verm); }
  .tela.r .w.dest { color: var(--tinta); }
  .tela.c .w.soco { color: var(--verm); }
  .carimbo .bloco { border: 14px solid var(--verm); padding: 28px 44px 34px; }
  .carimbo .w { color: var(--verm) !important; }
  .risco { width: 1080px; height: 7px; background: var(--verm); transform-origin: 0 50%;
    box-shadow: 0 0 18px 5px rgba(223,25,4,.85), 0 0 70px 14px rgba(223,25,4,.4); }
  .risco::after { content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 3px; background: #FFE2D8; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="239.85" data-width="1080" data-height="1920">
  <div id="fundo" class="abs cheio k"></div>
  <div id="luz" class="abs"></div>
  <div id="faixas" class="abs cheio"><i></i><i></i></div>
  <div id="vinheta" class="abs cheio"></div>
  <svg id="lousa" class="abs cheio" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="palco" class="abs cheio"></div>
  <canvas id="faisca" class="abs" width="1080" height="1920"></canvas>
  <div id="risco" class="abs risco" style="opacity:0"></div>
  <svg width="0" height="0" style="position:absolute"><defs id="filtros"></defs></svg>
</div>
<script src="roteiro.js"></script>
<script src="tempos.js"></script>
<script src="motor.js"></script>
</body>
</html>
