<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1200" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Open+Sans:wdth,wght@75,300;75,400&display=swap" />
<script src="gsap.min.js"></script>
<script src="rough.js"></script>
<script src="studio.js"></script>
<style>
  /* preto inteiro, cereja como destaque, branco às vezes */
  :root { --preto: #050505; --branco: #F2F0EC; --cinza: #8C8781; --cinza2: #5E5A56; --cereja: #C8102E; --cereja2: #E0274A; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--preto); }
  #root { position: relative; width: 1920px; height: 1200px; overflow: hidden; background: var(--preto);
    font-family: 'Archivo', sans-serif; color: var(--branco); }
  .abs { position: absolute; left: 0; top: 0; }
  .cheio { width: 1920px; height: 1200px; }
  #brilho { width: 1700px; height: 1100px; margin: -550px 0 0 -850px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(200,16,46,.16) 0%, rgba(200,16,46,.05) 40%, rgba(5,5,5,0) 70%); }
  #lousa text.rotulo { font-family: 'Open Sans', sans-serif; font-stretch: 75%; font-weight: 300; fill: var(--cinza); }
  #lousa text.forte { font-family: 'Archivo', sans-serif; font-weight: 800; font-stretch: 100%; }
  #palco { perspective: 2200px; perspective-origin: 960px 600px; }
  .tela { display: none; width: 1920px; height: 1200px; transform-style: preserve-3d; }
  .bloco { position: absolute; }
  .l { white-space: nowrap; line-height: 1.08; letter-spacing: -0.02em; }
  .l > span { display: inline-block; }
  .w { display: inline-block; position: relative; font-weight: 700; color: var(--branco); will-change: transform, filter, opacity; }
  .w.leve { font-weight: 400; color: var(--cinza); }
  .w.dest { color: var(--cereja2); font-weight: 800; }
  .w.forte { font-weight: 850; font-stretch: 112%; letter-spacing: -0.03em; }
  .w.soco { font-weight: 850; letter-spacing: -0.03em; }
  .w .b2 { color: var(--cereja2); }
  .w .sub { position: absolute; left: 0; right: 0; bottom: -0.06em; height: 0.06em; min-height: 5px; background: var(--cereja); transform-origin: 0 50%; transform: scaleX(0); }
  .tela.alto .w { text-shadow: 0 0 60px rgba(200,16,46,.28); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="253.04" data-width="1920" data-height="1200">
  <div id="brilho" class="abs"></div>
  <svg id="lousa" class="abs cheio" viewBox="0 0 1920 1200" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="palco" class="abs cheio"></div>
</div>
<script src="roteiro.js"></script>
<script src="tempos.js"></script>
<script src="motor.js"></script>
</body>
</html>
